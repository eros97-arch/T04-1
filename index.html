<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			background: #f4f7fb;
			font-family: Arial, sans-serif;
		}

		svg {
			display: block;
			width: min(100%, 800px);
			height: auto;
			margin: 0 auto;
			border: 3px solid #2f4858;
			background: #b9e6f2;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
		}

		#scene-annotated #annotations text,
		#scene-annotated #annotations line {
			pointer-events: none;
		}

		#scene-annotated #annotations text {
			stroke: none;
		}

		#scene-adjusted #adjusted-fence {
			stroke-dasharray: 12 8;
		}

		#scene-adjusted .adjusted-footpath {
			fill: #c4b59a;
			stroke: #685f50;
			stroke-width: 2;
		}
	</style>
</head>
<body>
	<figure id="scene-original">
	<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-description">
		<title id="scene-title">T04 – SVG House &amp; Garden</title>
		<desc id="scene-description">A colorful house and garden scene with a sunny sky, cloud, tree, fence, curved garden path, and caption.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="350" fill="#b9e6f2"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#8fcf79"></rect>

		<!-- Sun and cloud -->
		<circle cx="690" cy="85" r="48" fill="#ffd166"></circle>
		<ellipse cx="170" cy="105" rx="75" ry="30" fill="#ffffff"></ellipse>
		<circle cx="120" cy="100" r="32" fill="#ffffff"></circle>
		<circle cx="185" cy="88" r="40" fill="#ffffff"></circle>
		<line x1="690" y1="20" x2="690" y2="5" stroke="#e09f24" stroke-width="5"></line>

		<!-- Tree -->
		<rect x="90" y="245" width="32" height="125" fill="#8b5a2b"></rect>
		<circle cx="105" cy="215" r="58" fill="#3d8b4f"></circle>
		<circle cx="65" cy="245" r="42" fill="#4cae5b"></circle>
		<circle cx="150" cy="245" r="45" fill="#359447"></circle>

		<!-- House -->
		<rect x="275" y="230" width="280" height="190" fill="#f4a261" stroke="#7b3f00" stroke-width="4"></rect>
		<polygon points="245,235 415,105 585,235" fill="#b54b42" stroke="#71302d" stroke-width="5"></polygon>
		<rect x="490" y="145" width="42" height="75" fill="#8b5a2b" stroke="#71302d" stroke-width="4"></rect>
		<rect x="385" y="320" width="62" height="100" fill="#6d4c41" stroke="#49352f" stroke-width="4"></rect>
		<circle cx="435" cy="372" r="5" fill="#ffd166"></circle>

		<!-- Windows -->
		<rect x="305" y="275" width="62" height="55" fill="#9bd7e8" stroke="#49352f" stroke-width="4"></rect>
		<line x1="336" y1="275" x2="336" y2="330" stroke="#49352f" stroke-width="4"></line>
		<line x1="305" y1="302" x2="367" y2="302" stroke="#49352f" stroke-width="4"></line>
		<rect x="465" y="275" width="62" height="55" fill="#9bd7e8" stroke="#49352f" stroke-width="4"></rect>
		<line x1="496" y1="275" x2="496" y2="330" stroke="#49352f" stroke-width="4"></line>
		<line x1="465" y1="302" x2="527" y2="302" stroke="#49352f" stroke-width="4"></line>

		<!-- Fence and curved path -->
		<polyline points="15,375 55,375 55,335 75,335 75,375 115,375 115,335 135,335 135,375 175,375 175,335 195,335 195,375 235,375" fill="none" stroke="#8b5a2b" stroke-width="8"></polyline>
		<path d="M416 420 C410 445 335 455 300 500 L520 500 C485 455 440 445 416 420 Z" fill="#d6b07c" stroke="#a87945" stroke-width="3"></path>

		<!-- Caption -->
		<text x="400" y="475" text-anchor="middle" font-size="22" font-weight="bold" fill="#24404d">Welcome to the house and garden</text>
	</svg>
	<figcaption>Original scene</figcaption>
	</figure>

	<figure id="scene-annotated-figure">
	<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="annotated-scene-title annotated-scene-description">
		<title id="annotated-scene-title">T04 – SVG House &amp; Garden with shape annotations</title>
		<desc id="annotated-scene-description">The original house and garden scene with labels showing SVG shape attributes.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="350" fill="#b9e6f2"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#8fcf79"></rect>

		<!-- Sun and cloud -->
		<circle cx="690" cy="85" r="48" fill="#ffd166"></circle>
		<ellipse cx="170" cy="105" rx="75" ry="30" fill="#ffffff"></ellipse>
		<circle cx="120" cy="100" r="32" fill="#ffffff"></circle>
		<circle cx="185" cy="88" r="40" fill="#ffffff"></circle>
		<line x1="690" y1="20" x2="690" y2="5" stroke="#e09f24" stroke-width="5"></line>

		<!-- Tree -->
		<rect x="90" y="245" width="32" height="125" fill="#8b5a2b"></rect>
		<circle cx="105" cy="215" r="58" fill="#3d8b4f"></circle>
		<circle cx="65" cy="245" r="42" fill="#4cae5b"></circle>
		<circle cx="150" cy="245" r="45" fill="#359447"></circle>

		<!-- House -->
		<rect x="275" y="230" width="280" height="190" fill="#f4a261" stroke="#7b3f00" stroke-width="4"></rect>
		<polygon points="245,235 415,105 585,235" fill="#b54b42" stroke="#71302d" stroke-width="5"></polygon>
		<rect x="490" y="145" width="42" height="75" fill="#8b5a2b" stroke="#71302d" stroke-width="4"></rect>
		<rect x="385" y="320" width="62" height="100" fill="#6d4c41" stroke="#49352f" stroke-width="4"></rect>
		<circle cx="435" cy="372" r="5" fill="#ffd166"></circle>

		<!-- Windows -->
		<rect x="305" y="275" width="62" height="55" fill="#9bd7e8" stroke="#49352f" stroke-width="4"></rect>
		<line x1="336" y1="275" x2="336" y2="330" stroke="#49352f" stroke-width="4"></line>
		<line x1="305" y1="302" x2="367" y2="302" stroke="#49352f" stroke-width="4"></line>
		<rect x="465" y="275" width="62" height="55" fill="#9bd7e8" stroke="#49352f" stroke-width="4"></rect>
		<line x1="496" y1="275" x2="496" y2="330" stroke="#49352f" stroke-width="4"></line>
		<line x1="465" y1="302" x2="527" y2="302" stroke="#49352f" stroke-width="4"></line>

		<!-- Fence and curved path -->
		<polyline points="15,375 55,375 55,335 75,335 75,375 115,375 115,335 135,335 135,375 175,375 175,335 195,335 195,375 235,375" fill="none" stroke="#8b5a2b" stroke-width="8"></polyline>
		<path d="M416 420 C410 445 335 455 300 500 L520 500 C485 455 440 445 416 420 Z" fill="#d6b07c" stroke="#a87945" stroke-width="3"></path>

		<!-- Caption -->
		<text x="400" y="475" text-anchor="middle" font-size="22" font-weight="bold" fill="#24404d">Welcome to the house and garden</text>

		<g id="annotations">
			<line x1="690" y1="85" x2="620" y2="55"></line>
			<text x="510" y="50">circle (cx=690, cy=85, r=48)</text>
			<line x1="275" y1="230" x2="250" y2="205"></line>
			<text x="35" y="200">rect (x=275, y=230, width=280, height=190)</text>
			<line x1="170" y1="105" x2="170" y2="145"></line>
			<text x="105" y="165">ellipse (cx=170, cy=105, rx=75, ry=30)</text>
			<line x1="690" y1="20" x2="650" y2="20"></line>
			<text x="530" y="18">line (x1=690, y1=20) -&gt; (x2=690, y2=5)</text>
			<line x1="115" y1="375" x2="115" y2="405"></line>
			<text x="20" y="425">polyline (15,375 55,375 55,335 ...)</text>
			<line x1="415" y1="105" x2="415" y2="75"></line>
			<text x="330" y="65">polygon (245,235 415,105 585,235)</text>
			<line x1="300" y1="500" x2="250" y2="475"></line>
			<text x="35" y="475">path (M416 420 C410 445 ... L520 500)</text>
			<line x1="400" y1="475" x2="500" y2="450"></line>
			<text x="505" y="450">text (x=400, y=475)</text>
		</g>
	</svg>
	<figcaption>Annotated scene (Step 2)</figcaption>
	</figure>

	<figure id="scene-adjusted-figure">
	<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="adjusted-scene-title adjusted-scene-description">
		<title id="adjusted-scene-title">T04 – SVG House &amp; Garden adjusted scene</title>
		<desc id="adjusted-scene-description">An adjusted house and garden scene with improved contrast, a dashed fence, a footpath, mailbox, and chimney smoke.</desc>

		<!-- Sky and grass retain the original coordinate scale. -->
		<rect x="0" y="0" width="800" height="350" fill="#a9ddea"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#79bd68"></rect>

		<!-- Sun and cloud use stronger contrast for clearer silhouettes. -->
		<circle cx="690" cy="85" r="48" fill="#ffc247" stroke="#a76600" stroke-width="2"></circle>
		<ellipse cx="170" cy="105" rx="75" ry="30" fill="#ffffff" stroke="#8aaab3" stroke-width="2"></ellipse>
		<circle cx="120" cy="100" r="32" fill="#ffffff" stroke="#8aaab3" stroke-width="2"></circle>
		<circle cx="185" cy="88" r="40" fill="#ffffff" stroke="#8aaab3" stroke-width="2"></circle>
		<line x1="690" y1="20" x2="690" y2="5" stroke="#a76600" stroke-width="3"></line>

		<!-- Small translation balances the tree against the shifted house. -->
		<g id="adjusted-tree" transform="translate(12,0)">
			<rect x="90" y="245" width="32" height="125" fill="#70451f" stroke="#4d3119" stroke-width="3"></rect>
			<circle cx="105" cy="215" r="58" fill="#277a3e" stroke="#19562c" stroke-width="3"></circle>
			<circle cx="65" cy="245" r="42" fill="#3b994b" stroke="#19562c" stroke-width="2"></circle>
			<circle cx="150" cy="245" r="45" fill="#318f43" stroke="#19562c" stroke-width="2"></circle>
		</g>

		<!-- The house moves slightly left to open the right side of the garden. -->
		<path class="adjusted-footpath" d="M408 420 C408 395 400 365 408 320 L450 320 C458 365 445 397 440 420 Z"></path>
		<g id="adjusted-house" transform="translate(-8,0)">
			<rect x="275" y="230" width="280" height="190" fill="#e9784f" stroke="#65301f" stroke-width="5"></rect>
			<polygon points="245,235 415,105 585,235" fill="#963f3a" stroke="#542321" stroke-width="6"></polygon>
			<rect x="490" y="145" width="42" height="75" fill="#70451f" stroke="#542321" stroke-width="4"></rect>
			<rect x="385" y="320" width="62" height="100" fill="#5a3d35" stroke="#33231f" stroke-width="5"></rect>
			<circle cx="435" cy="372" r="5" fill="#ffc247"></circle>

			<!-- Window strokes are slightly lighter so the panes remain legible. -->
			<rect x="305" y="275" width="62" height="55" fill="#8fd1e4" stroke="#33231f" stroke-width="4"></rect>
			<line x1="336" y1="275" x2="336" y2="330" stroke="#33231f" stroke-width="3"></line>
			<line x1="305" y1="302" x2="367" y2="302" stroke="#33231f" stroke-width="3"></line>
			<rect x="465" y="275" width="62" height="55" fill="#8fd1e4" stroke="#33231f" stroke-width="4"></rect>
			<line x1="496" y1="275" x2="496" y2="330" stroke="#33231f" stroke-width="3"></line>
			<line x1="465" y1="302" x2="527" y2="302" stroke="#33231f" stroke-width="3"></line>
		</g>

		<!-- Dashed fence makes the boundary lighter and more varied. -->
		<polyline id="adjusted-fence" points="15,375 55,375 55,335 75,335 75,375 115,375 115,335 135,335 135,375 175,375 175,335 195,335 195,375 235,375" fill="none" stroke="#70451f" stroke-width="5"></polyline>
		<path d="M416 420 C410 445 335 455 300 500 L520 500 C485 455 440 445 416 420 Z" fill="#c4a875" stroke="#685f50" stroke-width="3"></path>

		<!-- A mailbox sits beside the new curved footpath. -->
		<rect x="540" y="350" width="12" height="55" fill="#70451f" stroke="#4d3119" stroke-width="2"></rect>
		<path d="M525 350 V335 Q525 320 540 320 H565 Q580 320 580 335 V350 Z" fill="#3f7180" stroke="#274852" stroke-width="3"></path>
		<polygon points="550,335 560,340 550,345" fill="#ffc247"></polygon>

		<!-- Ellipses form a subtle puff of smoke above the chimney. -->
		<ellipse cx="515" cy="120" rx="18" ry="11" fill="#d7e1e2" opacity="0.85"></ellipse>
		<ellipse cx="530" cy="95" rx="14" ry="9" fill="#d7e1e2" opacity="0.7"></ellipse>
		<ellipse cx="520" cy="72" rx="10" ry="7" fill="#d7e1e2" opacity="0.55"></ellipse>

		<!-- Caption -->
		<text x="400" y="475" text-anchor="middle" font-size="22" font-weight="bold" fill="#24404d">Welcome to the house and garden</text>
	</svg>
	<figcaption>Adjusted scene (Step 3)</figcaption>
	</figure>
</body>
</html>
